version: 1
fail_closed: true

actions:
  inspect:
    decision: ALLOW
    roles: [builder, reviewer]
  edit_assigned_worktree:
    decision: ALLOW
    roles: [builder]
  run_approved_tests:
    decision: ALLOW
    roles: [builder, verifier]
  review_candidate:
    decision: ALLOW
    roles: [reviewer]
  mutate_protected_branch:
    decision: HUMAN_GATE
    roles: [controller]
  deploy_production:
    decision: HUMAN_GATE
    roles: [controller]
  access_controller_secrets:
    decision: DENY
    roles: [builder, reviewer]
  change_policy:
    decision: HUMAN_GATE
    roles: [controller]

required_before_mutation:
  - fresh_lease
  - current_fencing_token
  - exact_candidate_binding
  - trusted_evidence
  - explicit_capability
  - budget_available