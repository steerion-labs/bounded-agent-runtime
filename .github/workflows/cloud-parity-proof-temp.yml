name: Temporary BAR cloud parity proof

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  proof:
    if: github.event.pull_request.number == 19
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Run BAR cloud parity proof
        run: bash scripts/cloud-parity-proof.sh
