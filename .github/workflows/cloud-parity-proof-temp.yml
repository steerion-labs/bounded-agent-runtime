name: Temporary BAR cloud parity proof

on:
  push:
    branches:
      - chore/cloud-first-work-mode-20260903

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Run BAR cloud parity proof
        run: bash scripts/cloud-parity-proof.sh
