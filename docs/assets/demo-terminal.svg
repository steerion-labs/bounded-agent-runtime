<rect x="1" y="1" width="998" height="518" rx="25" fill="none" stroke="#29445f"/>
<circle cx="42" cy="38" r="7" fill="#f06b6b"/><circle cx="66" cy="38" r="7" fill="#f6b84a"/><circle cx="90" cy="38" r="7" fill="#35d3ad"/>
<text x="126" y="44" fill="#91a8bf" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">bar — attack demo</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">
  <text x="48" y="105" fill="#a9bdd2">$ npm run demo:attack</text>
  <text x="48" y="158" fill="#f5f8fc">BAR ATTACK DEMO — deterministic authority boundary</text>
