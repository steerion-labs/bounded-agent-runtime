  <text x="48" y="294" fill="#35d3ad">BLOCKED</text><text x="160" y="294" fill="#dce7f2">protected merge request</text>
  <text x="48" y="336" fill="#35d3ad">BLOCKED</text><text x="160" y="336" fill="#dce7f2">request tampering</text>
  <text x="48" y="405" fill="#f6b84a">RESULT</text><text x="160" y="405" fill="#f5f8fc">4/4 ATTACKS BLOCKED</text>
