<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Bounded Agent Runtime</title>
<desc id="desc">Capability is not authority. Agents think, BAR authorizes, evidence is verified and humans approve protected decisions.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07111d"/>
    <stop offset="1" stop-color="#10243a"/>
  </linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#35d3ad"/>
    <stop offset="1" stop-color="#8ba7ff"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="16"/></filter>
</defs>
<rect width="1200" height="500" rx="30" fill="url(#bg)"/>
<circle cx="1040" cy="70" r="160" fill="#8ba7ff" opacity=".08" filter="url(#glow)"/>
<circle cx="120" cy="450" r="180" fill="#35d3ad" opacity=".08" filter="url(#glow)"/>
<text x="70" y="92" fill="#35d3ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" letter-spacing="3">BOUNDED AGENT RUNTIME</text>
<text x="70" y="185" fill="#f5f8fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="-3">Capability is not Authority.</text>
<text x="70" y="235" fill="#a9bdd2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24">Give AI agents freedom to work. Keep protected decisions outside the model.</text>

<g transform="translate(70 310)">
  <rect x="0" y="0" width="180" height="76" rx="18" fill="#0d1b2b" stroke="#29445f"/>
  <text x="90" y="32" text-anchor="middle" fill="#f5f8fc" font-family="Inter,Segoe UI,Arial" font-size="17" font-weight="700">AGENT</text>
  <text x="90" y="55" text-anchor="middle" fill="#8fa8bf" font-family="Inter,Segoe UI,Arial" font-size="13">Codex · Claude · OpenCode</text>

  <path d="M190 38 H265" stroke="url(#line)" stroke-width="3"/>
  <path d="M253 29 L267 38 L253 47" fill="none" stroke="#35d3ad" stroke-width="3"/>

  <rect x="278" y="-12" width="220" height="100" rx="22" fill="#10243a" stroke="#35d3ad" stroke-width="2"/>
  <text x="388" y="28" text-anchor="middle" fill="#35d3ad" font-family="Inter,Segoe UI,Arial" font-size="24" font-weight="900">BAR</text>
  <text x="388" y="53" text-anchor="middle" fill="#f5f8fc" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700">DETERMINISTIC AUTHORITY</text>
  <text x="388" y="72" text-anchor="middle" fill="#8fa8bf" font-family="Inter,Segoe UI,Arial" font-size="12">scope · evidence · budgets</text>

  <path d="M508 38 H583" stroke="url(#line)" stroke-width="3"/>
  <path d="M571 29 L585 38 L571 47" fill="none" stroke="#8ba7ff" stroke-width="3"/>

  <rect x="598" y="0" width="190" height="76" rx="18" fill="#0d1b2b" stroke="#29445f"/>
  <text x="693" y="32" text-anchor="middle" fill="#f5f8fc" font-family="Inter,Segoe UI,Arial" font-size="17" font-weight="700">VERIFIED CANDIDATE</text>
  <text x="693" y="55" text-anchor="middle" fill="#8fa8bf" font-family="Inter,Segoe UI,Arial" font-size="13">commit + tree + evidence</text>

  <path d="M798 38 H873" stroke="url(#line)" stroke-width="3"/>
  <path d="M861 29 L875 38 L861 47" fill="none" stroke="#8ba7ff" stroke-width="3"/>

  <rect x="888" y="0" width="172" height="76" rx="18" fill="#171b22" stroke="#f6b84a"/>
  <text x="974" y="32" text-anchor="middle" fill="#f6b84a" font-family="Inter,Segoe UI,Arial" font-size="17" font-weight="800">HUMAN GATE</text>
  <text x="974" y="55" text-anchor="middle" fill="#b9c6d3" font-family="Inter,Segoe UI,Arial" font-size="13">protected decisions</text>
</g>

<text x="70" y="455" fill="#8fa8bf" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Agents think. BAR authorizes. Evidence is verified. Humans approve.</text>
</svg>
